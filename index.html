<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1310">
<title>Kickoff</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: matchday floodlights — quick, confident, scoreboard-sharp
   IDEA: the stadium scoreboard + match programme in your pocket
   PICTURE: live score cards and big news photos carry the screen
   COLOUR/TYPE: night pitch #0a1310, turf #13241c, floodlight lime #c8f43c, card red #ff4d4d; Barlow Condensed + Inter
   LAYOUT: sticky header, date strip, league chips, list; bottom tab bar; full-screen sheets for match/team/story */
:root{--bg:#0a1310;--card:#13241c;--card2:#1a2f25;--line:#24392e;--ink:#eef5f0;--mute:#8fa598;--acc:#c8f43c;--accInk:#0a1310;--red:#ff4d4d;--safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top)}
:root[data-theme=light]{--bg:#f2f5f1;--card:#ffffff;--card2:#eaf0ea;--line:#dbe4dc;--ink:#0d1a14;--mute:#5b6e63;--acc:#2f7d1e;--accInk:#fff}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f2f5f1;--card:#ffffff;--card2:#eaf0ea;--line:#dbe4dc;--ink:#0d1a14;--mute:#5b6e63;--acc:#2f7d1e;--accInk:#fff}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--acc)}
.cond{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.2px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + var(--safe-t)) 16px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand h1{margin:0;font:700 28px/1 "Barlow Condensed",sans-serif}
.brand h1 b{color:var(--acc)}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--card)}
.iconbtn svg{width:20px;height:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap;min-height:36px}
.chip.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.dates .chip{display:flex;flex-direction:column;align-items:center;line-height:1.1;padding:6px 12px;min-width:56px}
.dates .chip small{font-weight:500;opacity:.75;font-size:11px}
main{padding:12px 12px calc(90px + var(--safe-b));max-width:760px;margin:0 auto}
.lg{margin:14px 0 6px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:var(--mute)}
.lg img{width:18px;height:18px;object-fit:contain}
.match{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:6px;width:100%;text-align:left}
.match .st{font-size:12px;color:var(--mute);text-align:center;font-weight:600}
.match .st.live{color:var(--red)}
.match .st.live::before{content:"";display:block;width:7px;height:7px;border-radius:50%;background:var(--red);margin:0 auto 3px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.match .st.live::before{animation:none}}
.tm{display:flex;align-items:center;gap:8px;padding:2px 0;font-weight:500}
.tm img,.crest{width:22px;height:22px;object-fit:contain;flex:none}
.tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm.win{font-weight:700}
.tm .fav{color:var(--acc);font-size:11px}
.sc{display:flex;flex-direction:column;gap:2px;text-align:right;font:700 20px/1.2 "Barlow Condensed",sans-serif;min-width:24px}
.sc.live{color:var(--acc)}
.empty{text-align:center;color:var(--mute);padding:48px 16px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:40px auto;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* news */
.hero{display:block;position:relative;border-radius:18px;overflow:hidden;background:var(--card);margin-bottom:12px;width:100%;text-align:left}
.hero img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--card2)}
.hero .cap{position:absolute;inset:auto 0 0 0;padding:48px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff}
.hero h2{margin:0;font:700 26px/1.08 "Barlow Condensed",sans-serif;text-wrap:balance}
.meta{font-size:12px;color:var(--mute);margin-top:4px}
.hero .meta{color:#cfd8d2}
.story{display:grid;grid-template-columns:1fr 112px;gap:12px;background:var(--card);border-radius:14px;padding:10px;margin-bottom:8px;width:100%;text-align:left;align-items:start}
.story img{width:112px;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--card2)}
.story h3{margin:0;font-size:15px;line-height:1.3;font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--acc);margin-bottom:3px}
/* tables */
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;font-size:13px}
th{font-weight:600;color:var(--mute);font-size:12px;padding:10px 4px;text-align:right}
td{padding:9px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
td:first-child,th:first-child{width:28px;padding-left:10px;color:var(--mute)}
td.pts{font-weight:700;padding-right:10px}
.tcell{display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
tr.zone-cl td:first-child{box-shadow:inset 3px 0 #3b82f6}
tr.zone-rel td:first-child{box-shadow:inset 3px 0 var(--red)}
tr.myteam{background:var(--card2)}
@media(max-width:420px){.hide-s{display:none}}
.grpname{margin:16px 0 8px;font:700 18px "Barlow Condensed",sans-serif}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs button{padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);min-height:56px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--acc)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;padding-bottom:calc(30px + var(--safe-b))}
.sheet.open{transform:none}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheethead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) 12px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.sheethead .ttl{flex:1;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sbody{max-width:760px;margin:0 auto;padding:12px}
.board{background:radial-gradient(120% 90% at 50% 0%,var(--card2),var(--card));border-radius:20px;padding:18px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px}
.board img{width:56px;height:56px;object-fit:contain}
.board .nm{font-weight:600;font-size:14px;margin-top:6px}
.board .big{font:700 52px/1 "Barlow Condensed",sans-serif;white-space:nowrap}
.board .stt{font-size:13px;color:var(--mute);font-weight:600;margin-top:4px}
.board .stt.live{color:var(--red)}
.under{font-size:12px;color:var(--mute);text-align:center;margin:10px 0 0}
.seg{display:flex;gap:6px;margin:14px 0 10px;overflow-x:auto}
.ev{display:grid;grid-template-columns:1fr 44px 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev .min{text-align:center;font:700 16px "Barlow Condensed",sans-serif;color:var(--mute)}
.ev .r{text-align:left}.ev .l{text-align:right}
.ev small{display:block;color:var(--mute);font-size:12px}
.ico{display:inline-block;width:10px;height:13px;border-radius:2px;vertical-align:-1px;margin:0 4px}
.ico.y{background:#f5c518}.ico.rd{background:var(--red)}
.stat{margin:12px 0}
.stat .row{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:5px}
.stat .row span:nth-child(2){color:var(--mute);font-weight:500;font-size:13px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.bars i{height:6px;border-radius:3px;background:var(--line);display:block;position:relative;overflow:hidden}
.bars i b{position:absolute;top:0;bottom:0;border-radius:3px}
.bars i:first-child b{right:0;background:var(--acc)}
.bars i:last-child b{left:0;background:#5aa9ff}
.lineups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lu{background:var(--card);border-radius:14px;padding:10px}
.lu h4{margin:0 0 8px;font-size:14px;display:flex;gap:6px;align-items:center}
.pl{display:flex;gap:8px;font-size:13px;padding:5px 0;border-top:1px solid var(--line);align-items:baseline}
.pl .n{width:22px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums;flex:none}
.pl .p{margin-left:auto;color:var(--mute);font-size:11px;flex:none}
.pl .sub{color:var(--acc);font-size:11px;flex:none}
.lu .lab{font-size:11px;color:var(--mute);font-weight:600;margin:10px 0 2px}
.form{display:flex;gap:4px}
.form i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:700 12px Inter;font-style:normal;color:#fff}
.form .W{background:#22a35a}.form .D{background:#7b8a82}.form .L{background:var(--red)}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--acc);color:var(--accInk);font-weight:700;text-decoration:none}
.btn.ghost{background:var(--card);color:var(--ink)}
.article img.lead{width:100%;border-radius:16px;aspect-ratio:16/9;object-fit:cover}
.article h2{font:700 30px/1.08 "Barlow Condensed",sans-serif;margin:14px 0 6px;text-wrap:balance}
.article .body{font-size:16px;line-height:1.65}
.article .body img{max-width:100%;height:auto;border-radius:10px}
.teamhead{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.teamhead img{width:64px;height:64px;object-fit:contain}
.teamhead h2{margin:0;font:700 30px/1 "Barlow Condensed",sans-serif}
.favlist .row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;width:100%;text-align:left}
.favlist .row img{width:32px;height:32px;object-fit:contain}
.sw{margin-left:auto;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--acc)}.sw.on::after{left:23px}
.toast{position:fixed;left:50%;bottom:calc(76px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.upd{font-size:11px;color:var(--mute);text-align:center;margin-top:12px;line-height:1.7}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#22c55e;margin-right:6px;vertical-align:1px;animation:pulse 2s infinite}
.pill{position:fixed;top:calc(118px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:25;background:var(--acc);color:var(--accInk);font-weight:700;font-size:13px;padding:10px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.35);min-height:40px}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 class="cond">KICK<b>OFF</b></h1>
    <div style="display:flex;gap:8px">
      <button class="iconbtn" id="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
    </div>
  </div>
  <div id="subbar"></div>
</header>
<main id="view"><div class="spin"></div></main>

<nav class="tabs" id="tabs">
  <button data-tab="matches" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/></svg>Matches</button>
  <button data-tab="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>News</button>
  <button data-tab="tables"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16M9 4v16"/></svg>Tables</button>
  <button data-tab="following"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Following</button>
</nav>

<section class="sheet" id="sheet" aria-modal="true" role="dialog">
  <div class="sheethead">
    <button class="iconbtn" id="sheetBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl" id="sheetTitle"></div>
    <div id="sheetAct"></div>
  </div>
  <div class="sbody" id="sheetBody"></div>
</section>
<div class="toast" id="toast"></div>

<script>
{
const API='https://site.api.espn.com/apis/site/v2/sports/soccer/';
const API2='https://site.api.espn.com/apis/v2/sports/soccer/';
const LEAGUES=[
 {id:'eng.1',n:'Premier League'},{id:'esp.1',n:'LaLiga'},{id:'uefa.champions',n:'Champions League'},
 {id:'ita.1',n:'Serie A'},{id:'ger.1',n:'Bundesliga'},{id:'fra.1',n:'Ligue 1'},
 {id:'ksa.1',n:'Saudi Pro League'},{id:'uefa.europa',n:'Europa League'},{id:'uefa.europa.conf',n:'Conference League'},
 {id:'eng.2',n:'Championship'},{id:'por.1',n:'Liga Portugal'},{id:'ned.1',n:'Eredivisie'},
 {id:'usa.1',n:'MLS'},{id:'eng.fa',n:'FA Cup'},{id:'fifa.friendly',n:'Internationals'}
];
const LN=Object.fromEntries(LEAGUES.map(l=>[l.id,l.n]));
const NEWS_LEAGUES=['eng.1','esp.1','uefa.champions','ita.1','ger.1','fra.1','ksa.1'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('ko_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('ko_'+k,JSON.stringify(v))}catch(e){}}};

const S={tab:store.get('tab','matches'),day:0,mLeague:'all',nLeague:'top',tLeague:store.get('tLeague','eng.1'),
  favs:store.get('favs',[]),alerts:store.get('alerts',false),lastScores:{},timer:null,stack:[]};

async function get(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok)throw new Error(r.status);
  return r.json();
}
const ymd=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
const dayOf=off=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+off);return d};
const tm=d=>new Date(d).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
const ago=d=>{const m=Math.round((Date.now()-new Date(d))/6e4);if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.round(m/60);if(h<24)return h+'h ago';return Math.round(h/24)+'d ago'};
const logoOf=t=>t?.logo||t?.logos?.[0]?.href||'';
const scoreOf=s=>s==null?'':typeof s==='object'?(s.displayValue??s.value??''):s;
const isFav=id=>S.favs.some(f=>f.id==id);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}

/* normalise an event from scoreboard, schedule or summary header */
function norm(ev,lg){
  const c=ev.competitions?.[0]||ev;
  const st=c.status||ev.status||{};
  const comps=c.competitors||[];
  const h=comps.find(x=>x.homeAway==='home')||comps[0]||{};
  const a=comps.find(x=>x.homeAway==='away')||comps[1]||{};
  const side=x=>({id:x.team?.id||x.id,name:x.team?.shortDisplayName||x.team?.displayName||'',full:x.team?.displayName||'',logo:logoOf(x.team),score:scoreOf(x.score),win:x.winner,form:x.form});
  const state=st.type?.state||'pre';
  return {id:ev.id,lg,date:ev.date||c.date,state,detail:st.type?.shortDetail||st.type?.detail||'',clock:st.displayClock,
    name:st.type?.name,h:side(h),a:side(a),venue:c.venue?.fullName||ev.venue?.displayName||'',details:c.details||[]};
}
function statusLabel(m){
  if(m.state==='in'){return m.detail&&/half/i.test(m.detail)?'HT':(m.clock||'LIVE')}
  if(m.state==='post'){return /postponed/i.test(m.detail)?'PPD':/pen/i.test(m.detail)?'PEN':'FT'}
  return tm(m.date);
}
function matchRow(m){
  const live=m.state==='in',pre=m.state==='pre';
  const t=(s)=>`<div class="tm ${m.state==='post'&&s.win?'win':''}"><img src="${esc(s.logo)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span>${esc(s.name)}</span>${isFav(s.id)?'<span class="fav">★</span>':''}</div>`;
  return `<button class="match" data-m="${esc(m.id)}" data-lg="${esc(m.lg)}">
    <div class="st ${live?'live':''}">${esc(statusLabel(m))}</div>
    <div>${t(m.h)}${t(m.a)}</div>
    <div class="sc ${live?'live':''}">${pre?'':`<span>${esc(m.h.score)}</span><span>${esc(m.a.score)}</span>`}</div></button>`;
}

/* ---------- MATCHES ---------- */
let MCACHE={};
async function loadMatches(silent,bg){
  // ESPN groups games by US date (behind Dubai), so a local day = that US day + early hours of the next
  const off=bg?0:S.day;
  const d=dayOf(off),prev=new Date(d);prev.setDate(d.getDate()-1);
  const key=ymd(d),days=[ymd(prev),key];
  const want=LEAGUES.map(l=>l.id);
  if(!silent)$('#view').innerHTML='<div class="spin"></div>';
  const jobs=[];for(const lg of want)for(const dy of days)jobs.push(get(API+lg+'/scoreboard?dates='+dy).then(j=>({lg,j})));
  const res=await Promise.allSettled(jobs);
  const all=[],seen=new Set();
  for(const r of res){if(r.status!=='fulfilled')continue;
    for(const ev of r.value.j.events||[]){if(seen.has(ev.id))continue;seen.add(ev.id);const m=norm(ev,r.value.lg);if(ymd(new Date(m.date))===key)all.push(m)}}
  checkGoals(all);
  if(off===0)scheduleRefresh(all.some(m=>m.state==='in'));
  if(bg&&S.day!==0)return;
  LAST.m=Date.now();
  MCACHE={key,all,at:new Date()};
  renderMatches();
}
function renderMatches(){
  if(S.tab!=='matches')return;
  let list=MCACHE.all||[];
  if(S.mLeague==='fav')list=list.filter(m=>isFav(m.h.id)||isFav(m.a.id));
  else if(S.mLeague!=='all')list=list.filter(m=>m.lg===S.mLeague);
  if(!list.length){$('#view').innerHTML=`<div class="empty">${S.mLeague==='fav'?(S.favs.length?'None of your teams play on this day.':'Follow teams from Tables or a match to see them here.'):'No matches on this day.'}</div>`;return}
  const live=list.filter(m=>m.state==='in');
  let html='';
  if(live.length&&S.mLeague==='all'){html+=`<div class="lg" style="color:var(--red)">● Live now</div>`+live.map(matchRow).join('')}
  const favM=list.filter(m=>(isFav(m.h.id)||isFav(m.a.id))&&!(S.mLeague==='all'&&m.state==='in'));

/* ---------- LIVE UPDATES: every screen refreshes itself in the background ---------- */
const LAST={};let BUSY=false;
function scheduleRefresh(live){S.anyLive=live}
function due(k,ms){if(Date.now()-(LAST[k]||0)<ms)return false;LAST[k]=Date.now();return true}
setInterval(async()=>{
  if(document.hidden||BUSY||!navigator.onLine)return;
  BUSY=true;
  try{
    if(S.stack.length){/* open match/team pages refresh themselves */}
    else if(S.tab==='matches'&&due('m',S.anyLive?20000:60000))await loadMatches(true);
    else if(S.tab==='news'&&due('n',60000))await loadNews(true);
    else if(S.tab==='tables'&&due('t',S.anyLive?45000:120000))await loadTable(true);
    // keep scores fresh in the background so goal alerts fire on any screen
    if(S.tab!=='matches'&&S.favs.length&&due('bg',S.anyLive?30000:120000))await loadMatches(true,true);
  }finally{BUSY=false}
},5000);
function liveStamp(){return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function checkGoals(all){
  for(const m of all){
    const k=m.id,cur=(m.h.score||0)+'-'+(m.a.score||0),old=S.lastScores[k];
    S.lastScores[k]=cur;
    if(!old||old===cur||m.state!=='in')continue;
    if(!(isFav(m.h.id)||isFav(m.a.id)))continue;
    const msg=`${m.h.name} ${m.h.score} – ${m.a.score} ${m.a.name}`;

      navigator.serviceWorker.ready.then(r=>r.showNotification('GOAL! ⚽',{body:msg+' ('+(m.clock||'')+')',icon:'icon-192.png',tag:'g'+k})).catch(()=>{});
    }
  }
}

/* ---------- NEWS ---------- */
let NEWS=[];
let PENDING=null,NEWSAT=null;
async function loadNews(silent){
  if(!silent)$('#view').innerHTML='<div class="spin"></div>';
  const which=S.nLeague;
  const lgs=which==='top'?NEWS_LEAGUES:[which];
  const res=await Promise.allSettled(lgs.map(lg=>get(API+lg+'/news?limit=25').then(j=>(j.articles||[]).map(a=>({...a,_lg:lg})))));
  if(which!==S.nLeague)return; // user switched league meanwhile
  const seen=new Set(),list=[];
  for(const r of res)if(r.status==='fulfilled')for(const a of r.value){if(seen.has(a.id))continue;seen.add(a.id);list.push(a)}
  if(silent&&!list.length)return; // keep what's on screen if a refresh fails
  list.sort((a,b)=>new Date(b.published)-new Date(a.published));
  if(S.favs.length&&which==='top'){ // lift stories about followed teams
    const fid=new Set(S.favs.map(f=>String(f.id)));
    list.sort((a,b)=>(hasTeam(b,fid)-hasTeam(a,fid))||0);
  }
  LAST.n=Date.now();NEWSAT=new Date();
  const old=new Set(NEWS.map(a=>a.id));
  const fresh=silent?list.filter(a=>!old.has(a.id)).length:0;
  // reading further down: don't yank the page, offer a "new stories" pill instead
  if(silent&&fresh&&window.scrollY>200&&S.tab==='news'){PENDING=list;showPill(fresh);return}
  NEWS=list;PENDING=null;
  if(silent&&!fresh){const u=document.querySelector('#newsUpd');if(u){u.textContent=newsStamp();return}}
  renderNews();
  if(fresh)toast(fresh+' new '+(fresh>1?'stories':'story'));
}
const newsStamp=()=>'Live · updated '+(NEWSAT||new Date()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})+' · checks for new stories every minute';
function showPill(n){
  let p=document.getElementById('pill');
  if(!p){p=document.createElement('button');p.id='pill';p.className='pill';document.body.appendChild(p)}
  p.textContent='↑ '+n+' new '+(n>1?'stories':'story');p.hidden=false;
}
const hasTeam=(a,ids)=>(a.categories||[]).some(c=>c.teamId&&ids.has(String(c.teamId)))?1:0;
function img(a){const i=(a.images||[]).find(x=>x.type==='header')||a.images?.[0];return i?.url||''}
function renderNews(){

function sanitize(html){
  const t=document.createElement('template');t.innerHTML=html;
  t.content.querySelectorAll('script,style,iframe,object,embed,form,video,aside,photo,inline,inline1,inline2').forEach(n=>n.remove());
  t.content.querySelectorAll('*').forEach(n=>{for(const at of [...n.attributes]){if(/^on/i.test(at.name)||(at.name==='href'&&/^javascript/i.test(at.value)))n.removeAttribute(at.name)}if(n.tagName==='A'){n.target='_blank';n.rel='noopener'}});
  return t.innerHTML;

    <button data-team="${esc(m.a.id)}" data-tlg="${esc(lg)}"><img src="${esc(m.a.logo)}" alt=""><div class="nm">${esc(m.a.full||m.a.name)}</div></button></div>
    <p class="under">${esc(m.venue)}${sm?.gameInfo?.attendance?' · Att. '+Number(sm.gameInfo.attendance).toLocaleString():''}</p>`;
  const tabs=[];
  const evs=eventsHtml(sm,m,m0);if(evs)tabs.push(['Events',evs]);

function reMatch(id,lg,pre,ms){

function eventsHtml(sm,m,m0){

      const ico=/yellow/i.test(t)?'<i class="ico y"></i>':/red/i.test(t)?'<i class="ico rd"></i>':/goal|penalty - scored/i.test(t)?'⚽ ':/substitution/i.test(t)?'⇄ ':'';
      const sub=/substitution/i.test(t)?`${esc(who)}<small>off: ${esc(who2)}</small>`:`${esc(who||e.shortText||t)}<small>${esc(t)}${who2&&/goal/i.test(t)?' · assist '+esc(who2):''}</small>`;
      return {home:String(e.team?.id)===String(m.h.id),min:e.clock?.displayValue||'',html:ico+sub}});
  }else{
    const det=(m0?.details||m.details||[]);
    rows=det.map(d=>{const who=d.athletesInvolved?.[0]?.displayName||'';const ico=d.yellowCard?'<i class="ico y"></i>':d.redCard?'<i class="ico rd"></i>':d.scoringPlay?'⚽ ':'';
      return {home:String(d.team?.id)===String(m.h.id),min:d.clock?.displayValue||'',html:ico+esc(who)+`<small>${esc(d.type?.text||'')}${d.ownGoal?' (OG)':''}${d.penaltyKick?' (pen)':''}</small>`}});
  }

function statsHtml(sm){
  const T=sm?.boxscore?.teams;if(!T||T.length<2)return'';
  const h=T.find(t=>t.homeAway==='home')||T[0],a=T.find(t=>t.homeAway==='away')||T[1];
  const want=['possessionPct','totalShots','shotsOnTarget','wonCorners','foulsCommitted','yellowCards','redCards','offsides','saves','passPct','accuratePasses','totalTackles','interceptions'];
  const g=(t,n)=>(t.statistics||[]).find(s=>s.name===n);
  const out=want.map(n=>{const x=g(h,n),y=g(a,n);if(!x||!y)return'';
    const xv=parseFloat(x.displayValue)||0,yv=parseFloat(y.displayValue)||0,tot=xv+yv||1;
    const fmt=v=>n.endsWith('Pct')?Math.round(parseFloat(v)*(parseFloat(v)<=1?100:1))+'%':v;

  if(!out)return'';
  return `<div class="row" style="display:flex;justify-content:space-between;font-weight:600;font-size:13px"><span style="color:var(--acc)">${esc(h.team?.shortDisplayName)}</span><span style="color:#5aa9ff">${esc(a.team?.shortDisplayName)}</span></div>`+out;

function lineupsHtml(sm){

  const col=r=>{const ro=r.roster||[];const st=ro.filter(p=>p.starter).sort((a,b)=>(+a.formationPlace||99)-(+b.formationPlace||99)),sb=ro.filter(p=>!p.starter);
    const pl=p=>`<div class="pl"><span class="n">${esc(p.jersey||'')}</span><span>${esc(p.athlete?.shortName||p.athlete?.displayName)}</span>${p.subbedOut?'<span class="sub" style="color:var(--red)">↓</span>':''}${p.subbedIn&&!p.starter?'<span class="sub">↑</span>':''}<span class="p">${esc(p.position?.abbreviation||'')}</span></div>`;
    return `<div class="lu"><h4><img class="crest" src="${esc(logoOf(r.team))}" alt="">${esc(r.team?.shortDisplayName||r.team?.abbreviation||'')}</h4>${r.formation?`<div class="lab">${esc(r.formation)}</div>`:''}${st.map(pl).join('')}${sb.length?`<div class="lab">Substitutes</div>${sb.map(pl).join('')}`:''}</div>`};
  const h=R.find(r=>r.homeAway==='home')||R[0],a=R.find(r=>r.homeAway==='away')||R[1];

  const H=sm?.headToHeadGames?.[0]?.events;

  openSheet('Team','<div class="spin"></div>');
  const [sch,fx,nw]=await Promise.allSettled([get(API+lg+'/teams/'+id+'/schedule'),get(API+lg+'/teams/'+id+'/schedule?fixture=true'),get(API+lg+'/news?limit=50')]);
  const team=sch.value?.team||fx.value?.team||{};
  const t={id:String(id),name:team.shortDisplayName||team.displayName||'Team',logo:logoOf(team),lg};
  $('#sheetTitle').textContent=team.displayName||'Team';
  const favBtn=()=>`<button class="btn ${isFav(id)?'ghost':''}" id="favBtn">${isFav(id)?'★ Following':'☆ Follow'}</button>`;
  const bindFav=()=>{$('#sheetAct').innerHTML=favBtn();$('#favBtn').onclick=()=>{toggleFav(t);bindFav()}};
  bindFav();
  const evN=r=>(r.value?.events||[]).map(e=>norm(e,lg));
  const past=evN(sch).filter(m=>m.state==='post').sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6);
  const up=evN(fx).filter(m=>m.state!=='post').sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,6);
  const news=(nw.value?.articles||[]).filter(a=>(a.categories||[]).some(c=>String(c.teamId)===String(id))).map(a=>({...a,_lg:lg}));
  TEAMNEWS=news;
  let html=`<div class="teamhead"><img src="${esc(t.logo)}" alt=""><div><h2>${esc(team.displayName||'')}</h2><div class="meta">${esc(LN[lg]||'')}${team.standingSummary?' · '+esc(team.standingSummary):''}</div></div></div>`;
  html+=up.length?`<div class="lg">Upcoming</div>`+up.map(m=>teamRow(m)).join(''):'';
  html+=past.length?`<div class="lg">Recent results</div>`+past.map(m=>teamRow(m)).join(''):'';
  html+=news.length?`<div class="lg">Latest news</div>`+news.slice(0,10).map(a=>`<button class="story" data-tn="${esc(a.id)}"><div><h3>${esc(a.headline)}</h3><div class="meta">${ago(a.published)}</div></div>${img(a)?`<img src="${esc(img(a))}" alt="" loading="lazy">`:'<span></span>'}</button>`).join(''):'';
  if(!up.length&&!past.length&&!news.length)html+='<div class="empty">No fixtures found.</div>';
  $('#sheetBody').innerHTML=html;
  TEAMEV=[...up,...past];
}
let TEAMNEWS=[],TEAMEV=[];
function teamRow(m){
  const d=new Date(m.date);
  const lab=m.state==='pre'?d.toLocaleDateString([], {day:'numeric',month:'short'})+'<br>'+tm(m.date):d.toLocaleDateString([], {day:'numeric',month:'short'})+'<br>'+statusLabel(m);
  return matchRow(m).replace(/<div class="st([^"]*)">[^<]*<\/div>/,`<div class="st$1">${lab}</div>`).replace('class="match"','class="match" data-te="1"');
}

/* ---------- SHEET & ROUTING ---------- */
function openSheet(title,body){
  $('#sheetTitle').textContent=title;$('#sheetAct').innerHTML='';$('#sheetBody').innerHTML=body;
  const s=$('#sheet');s.classList.add('open');s.scrollTop=0;
}
function pushSheet(k,fn){S.stack.push({k,fn});history.pushState({s:S.stack.length},'');fn()}
function closeSheet(){
  S.stack.pop();
  if(S.stack.length){S.stack.at(-1).fn()}else{$('#sheet').classList.remove('open');if(S.tab==='tables')loadTable();if(S.tab==='matches')renderMatches()}
}
window.addEventListener('popstate',()=>{if(S.stack.length)closeSheet()});
$('#sheetBack').onclick=()=>history.back();

function show(tab){
  S.tab=tab;store.set('tab',tab);
  const pl=document.getElementById('pill');if(pl)pl.hidden=true;PENDING=null;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  window.scrollTo(0,0);
  if(tab==='matches'){$('#subbar').innerHTML=matchesBar();loadMatches();setTimeout(()=>{const on=document.querySelector('#dates .on');on&&on.scrollIntoView({inline:'center',block:'nearest'})},0)}
  if(tab==='news'){$('#subbar').innerHTML=newsBar();loadNews()}
  if(tab==='tables'){$('#subbar').innerHTML=tablesBar();loadTable()}
  if(tab==='following'){$('#subbar').innerHTML='';renderFollowing()}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button,tr');if(!b)return;
  const d=b.dataset;
  if(d.tab)return show(d.tab);
  if(d.day!=null){S.day=+d.day;$('#subbar').innerHTML=matchesBar();loadMatches();return}
  if(d.ml){S.mLeague=d.ml;$('#subbar').innerHTML=matchesBar();document.querySelector('#dates .on')?.scrollIntoView({inline:'center',block:'nearest'});MCACHE.key===ymd(dayOf(S.day))?renderMatches():loadMatches();return}
  if(d.nl){S.nLeague=d.nl;$('#subbar').innerHTML=newsBar();loadNews();return}
  if(d.tl){S.tLeague=d.tl;store.set('tLeague',d.tl);$('#subbar').innerHTML=tablesBar();loadTable();return}
  if(d.pane!=null){const root=b.closest('.sbody');root.querySelectorAll('[data-pane]').forEach(x=>x.classList.toggle('on',x===b));root.querySelectorAll('.pane').forEach(p=>p.hidden=p.dataset.p!==d.pane);return}
  if(d.m){const lg=d.lg;const pre=d.te?TEAMEV.find(x=>x.id==d.m):null;return pushSheet('m'+d.m,()=>openMatch(d.m,lg,pre))}
  if(d.team&&d.tlg)return pushSheet('t'+d.team,()=>openTeam(d.team,d.tlg));
  if(d.n)return pushSheet('n'+d.n,()=>openStory(d.n));
  if(d.tn)return pushSheet('n'+d.tn,()=>openStory(d.tn,TEAMNEWS));
  if(b.id==='pill'){b.hidden=true;if(PENDING){NEWS=PENDING;PENDING=null;renderNews()}window.scrollTo({top:0,behavior:'smooth'});return}
  if(b.id==='alertSw'){
    if(!S.alerts&&'Notification' in window){Notification.requestPermission().then(p=>{S.alerts=p==='granted';store.set('alerts',S.alerts);if(!S.alerts)toast('Notifications are blocked in Chrome settings');renderFollowing()})}
    else{S.alerts=!S.alerts;store.set('alerts',S.alerts);renderFollowing()}
    return;
  }
});
// the sheet's match/team buttons that sit inside the sheet already caught above; table rows use data-team too
$('#refresh').onclick=()=>{if(S.stack.length)return S.stack.at(-1).fn();show(S.tab)};
// coming back to the app: refresh whatever is on screen straight away
document.addEventListener('visibilitychange',()=>{if(!document.hidden){for(const k in LAST)LAST[k]=0}});
window.addEventListener('online',()=>{for(const k in LAST)LAST[k]=0;toast('Back online')});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
show(['matches','news','tables','following'].includes(S.tab)?S.tab:'matches');
}
</script>
